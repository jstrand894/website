      <ellipse cx="65" cy="94" rx="8.5" ry="7.5"/>
      <circle cx="73" cy="93" r="4.6"/>
    </g>
    <g fill="none" stroke="#f4ecf8" stroke-width="2.6" stroke-linecap="round">
      <path d="M76 94.5 Q86.5 96 90 106"/>
      <path d="M64 100 L68 111"/>
